version: "3.9"

services:
  backend:
    build:
      context: ./server
    container_name: smartinventory-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    container_name: smartinventory-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped